name: Publicar en Instagram

# v3 (30/08/2026): añadido Threads.
# La imagen sigue sin subirse a postimg.cc/imgur: se sube a la carpeta "images/"
# de este repo y el robot construye la URL pública solo (vía jsDelivr).
# Publica en el feed de Instagram, opcionalmente también en Historias de
# Instagram, y opcionalmente también en Threads (con un texto propio y más
# corto, porque en Threads no funciona bien copiar y pegar el mismo texto
# largo de Instagram).
#
# Cómo usarlo cada vez:
#   1. Sube la imagen final a la carpeta "images/" de este repo
#      (entra en la carpeta -> Add file -> Upload files -> arrastra el archivo -> Commit).
#   2. Ve a la pestaña Actions -> "Publicar en Instagram" -> Run workflow.
#   3. En "image_filename" escribe SOLO el nombre del archivo que acabas de subir
#      (ej: post-megaman-v1.png), no la ruta completa.
#   4. Pega el texto del post en "caption" (el de Instagram, el largo).
#   5. Si quieres que el mismo post salga también en Historias de Instagram,
#      escribe "si" en "story" (si no, déjalo en "no").
#   6. Si quieres publicar también en Threads, escribe "si" en "threads" y
#      rellena "caption_threads" con una versión más corta y conversacional
#      (100-200 caracteres, 0 o 1 hashtag como mucho). Si dejas "caption_threads"
#      vacío pero pones "threads" en "si", se usará el mismo texto de Instagram
#      (funciona, pero rinde peor en Threads).
#
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   IG_ACCOUNT_ID        -> 17841433174974811
#   IG_ACCESS_TOKEN      -> el token largo de Instagram de la guía del proyecto
#   THREADS_USER_ID       -> 28497515059900152
#   THREADS_ACCESS_TOKEN -> el token largo de Threads de la guía del proyecto

on:
  workflow_dispatch:
    inputs:
      image_filename:
        description: "Nombre del archivo ya subido a la carpeta images/ (ej: post.png)"
        required: true
      caption:
        description: "Texto del post para Instagram. Para saltos de párrafo escribe \\n entre líneas"
        required: true
      story:
        description: "¿Publicar también en Historias de Instagram? (si / no)"
        required: false
        default: "no"
      threads:
        description: "¿Publicar también en Threads? (si / no)"
        required: false
        default: "no"
      caption_threads:
        description: "Texto para Threads (más corto y conversacional). Si lo dejas vacío se usa el mismo texto de Instagram"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Construir y comprobar la URL pública de la imagen
        id: image
        env:
          IMAGE_FILENAME: ${{ github.event.inputs.image_filename }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URL="https://cdn.jsdelivr.net/gh/$REPO@$SHA/images/$IMAGE_FILENAME"
          echo "Probando: $IMAGE_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$IMAGE_URL")
            if [ "$STATUS" = "200" ]; then
              echo "Imagen encontrada (intento $i)."
              break
            fi
            echo "Intento $i: la CDN aún no la sirve (status $STATUS), esperando..."
            sleep 4
            if [ "$i" = "5" ]; then
              echo "::error::No se encontró la imagen en $IMAGE_URL. ¿Subiste el archivo a la carpeta images/ con ese nombre exacto, y ya está comiteado?"
              exit 1
            fi
          done
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"

      - name: Crear contenedor de medios (feed)
        id: create
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          CAPTION_RAW: ${{ github.event.inputs.caption }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          CAPTION=$(printf '%b' "$CAPTION_RAW")
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta: $RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          if [ -z "$CREATION_ID" ]; then
            echo "::error::No se pudo crear el contenedor de medios: $RESPONSE"
            exit 1
          fi
          echo "El contenedor se creó con id $CREATION_ID"
          echo "creation_id=$CREATION_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar a que Instagram procese la imagen
        run: sleep 15

      - name: Publicar el post en el feed
        env:
          CREATION_ID: ${{ steps.create.outputs.creation_id }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::Fallo al publicar en el feed: $RESPONSE"
            exit 1
          fi
          echo "✅ Publicado en el feed de @jeskocas"

      - name: Crear y publicar también en Historias de Instagram (si se pidió)
        if: ${{ github.event.inputs.story == 'si' || github.event.inputs.story == 'sí' }}
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "media_type=STORIES" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta (historia): $RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          if [ -z "$CREATION_ID" ]; then
            echo "::error::No se pudo crear el contenedor de la historia: $RESPONSE"
            exit 1
          fi
          sleep 10
          RESPONSE2=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta (publicar historia): $RESPONSE2"
          if echo "$RESPONSE2" | grep -q '"error"'; then
            echo "::error::Fallo al publicar la historia: $RESPONSE2"
            exit 1
          fi
          echo "✅ También publicado en Historias de Instagram"

      - name: Crear y publicar en Threads (si se pidió)
        if: ${{ github.event.inputs.threads == 'si' || github.event.inputs.threads == 'sí' }}
        env:
          IMAGE_URL: ${{ steps.image.outputs.image_url }}
          CAPTION_RAW: ${{ github.event.inputs.caption }}
          CAPTION_THREADS_RAW: ${{ github.event.inputs.caption_threads }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CAPTION_THREADS_RAW" ]; then
            CAPTION_T=$(printf '%b' "$CAPTION_THREADS_RAW")
          else
            echo "Aviso: no se rellenó caption_threads, se usará el texto de Instagram tal cual."
            CAPTION_T=$(printf '%b' "$CAPTION_RAW")
          fi

          RESPONSE=$(curl -s -X POST "https://graph.threads.net/v1.0/$THREADS_USER_ID/threads" \
            --data-urlencode "media_type=IMAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "text=$CAPTION_T" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
          echo "Respuesta de Threads (crear): $RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          if [ -z "$CREATION_ID" ]; then
            echo "::error::No se pudo crear el contenedor de Threads: $RESPONSE"
            exit 1
          fi
          echo "El contenedor de Threads se creó con id $CREATION_ID"

          echo "Esperando a que Threads procese la imagen..."
          sleep 20

          RESPONSE2=$(curl -s -X POST "https://graph.threads.net/v1.0/$THREADS_USER_ID/threads_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
          echo "Respuesta de Threads (publicar): $RESPONSE2"
          if echo "$RESPONSE2" | grep -q '"error"'; then
            echo "::error::Fallo al publicar en Threads: $RESPONSE2"
            exit 1
          fi
          echo "✅ Publicado en Threads @jeskocas"
