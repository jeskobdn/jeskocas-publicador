name: Publicar en Instagram

# v5 (17/09/2026): añadido FACEBOOK. (La v4 había añadido el carrusel.)
#
# Qué hace:
#   - Publica en el feed de Instagram una imagen suelta O un carrusel de hasta 10.
#   - Opcionalmente publica también en Historias de Instagram (siempre la 1ª imagen).
#   - Opcionalmente publica también en Threads (imagen suelta o carrusel).
#   - Opcionalmente publica también en la página de Facebook (foto suelta o álbum).
#
# Cómo usarlo cada vez:
#   1. Sube la(s) imagen(es) final(es) a la carpeta "images/" de este repo.
#   2. Actions -> "Publicar en Instagram" -> Run workflow.
#   3. En "image_filename":
#        - Una sola imagen:  post.png
#        - Carrusel:         slide1.png,slide2.png,slide3.png
#      (separadas por comas, EN ORDEN, sin espacios, máximo 10)
#   4. Pega el texto del post en "caption".
#   5. "story": si / no   -> publica también en Historias (usa la primera imagen).
#   6. "threads": si / no -> publica también en Threads.
#   7. "caption_threads": versión corta para Threads (si lo dejas vacío usa el caption largo).
#   8. "facebook": si / no -> publica también en la página de Facebook.
#   9. "caption_facebook": texto para Facebook (si lo dejas vacío usa el caption largo).
#
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   IG_ACCOUNT_ID         -> 17841433174974811
#   IG_ACCESS_TOKEN       -> token largo de Instagram
#   THREADS_USER_ID       -> 28497515059900152
#   THREADS_ACCESS_TOKEN  -> token largo de Threads
#   FB_PAGE_ID            -> 573938326000243
#   FB_PAGE_ACCESS_TOKEN  -> TOKEN DE PÁGINA (no el de usuario), sacado de me/accounts

on:
  workflow_dispatch:
    inputs:
      image_filename:
        description: "Archivo(s) de images/. Para carrusel: separa por comas EN ORDEN (máx 10)"
        required: true
      caption:
        description: "Texto del post para Instagram. Para saltos de párrafo escribe \\n entre líneas"
        required: true
      instagram:
        description: "¿Publicar en el feed de Instagram? (si / no). Ponlo en no para probar solo otra red"
        required: false
        default: "si"
      story:
        description: "¿Publicar también en Historias de Instagram? (si / no)"
        required: false
        default: "no"
      threads:
        description: "¿Publicar también en Threads? (si / no)"
        required: false
        default: "no"
      caption_threads:
        description: "Texto para Threads (más corto). Si lo dejas vacío se usa el de Instagram"
        required: false
        default: ""
      facebook:
        description: "¿Publicar también en la página de Facebook? (si / no)"
        required: false
        default: "no"
      caption_facebook:
        description: "Texto para Facebook. Si lo dejas vacío se usa el de Instagram"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Construir y comprobar las URLs públicas de las imágenes
        id: image
        env:
          IMAGE_FILENAMES: ${{ github.event.inputs.image_filename }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URLS=""
          COUNT=0
          IFS=',' read -ra FILES <<< "$IMAGE_FILENAMES"
          for RAW in "${FILES[@]}"; do
            NAME=$(echo "$RAW" | xargs)          # quita espacios sobrantes
            [ -z "$NAME" ] && continue
            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt 10 ]; then
              echo "::error::Instagram admite como máximo 10 imágenes por carrusel."
              exit 1
            fi
            URL="https://cdn.jsdelivr.net/gh/$REPO@$SHA/images/$NAME"
            echo "Probando ($COUNT): $URL"
            OK=0
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
              if [ "$STATUS" = "200" ]; then
                echo "  Imagen encontrada (intento $i)."
                OK=1
                break
              fi
              echo "  Intento $i: la CDN aún no la sirve (status $STATUS), esperando..."
              sleep 4
            done
            if [ "$OK" != "1" ]; then
              echo "::error::No se encontró la imagen en $URL. ¿Subiste '$NAME' a la carpeta images/ con ese nombre exacto y ya está comiteado?"
              exit 1
            fi
            URLS="$URLS $URL"
          done
          if [ "$COUNT" = "0" ]; then
            echo "::error::No se indicó ningún nombre de archivo."
            exit 1
          fi
          URLS=$(echo "$URLS" | xargs)
          echo "Total de imágenes: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"
          echo "first_url=$(echo "$URLS" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Crear contenedor de medios (feed)
        id: create
        if: ${{ github.event.inputs.instagram != 'no' }}
        env:
          URLS: ${{ steps.image.outputs.urls }}
          COUNT: ${{ steps.image.outputs.count }}
          CAPTION_RAW: ${{ github.event.inputs.caption }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          CAPTION=$(printf '%b' "$CAPTION_RAW")
          API="https://graph.facebook.com/v21.0"

          if [ "$COUNT" = "1" ]; then
            echo "--- Post de una sola imagen ---"
            RESPONSE=$(curl -s -X POST "$API/$IG_ACCOUNT_ID/media" \
              --data-urlencode "image_url=$URLS" \
              --data-urlencode "caption=$CAPTION" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN")
            echo "Respuesta de Meta: $RESPONSE"
            CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
            if [ -z "$CREATION_ID" ]; then
              echo "::error::No se pudo crear el contenedor de medios: $RESPONSE"
              exit 1
            fi
          else
            echo "--- Carrusel de $COUNT imágenes ---"
            CHILDREN=""
            N=0
            for URL in $URLS; do
              N=$((N+1))
              echo "Creando hijo $N/$COUNT: $URL"
              RESPONSE=$(curl -s -X POST "$API/$IG_ACCOUNT_ID/media" \
                --data-urlencode "image_url=$URL" \
                --data-urlencode "is_carousel_item=true" \
                --data-urlencode "access_token=$IG_ACCESS_TOKEN")
              echo "  Respuesta: $RESPONSE"
              CHILD_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
              if [ -z "$CHILD_ID" ]; then
                echo "::error::Fallo al crear la imagen $N del carrusel: $RESPONSE"
                exit 1
              fi
              if [ -z "$CHILDREN" ]; then
                CHILDREN="$CHILD_ID"
              else
                CHILDREN="$CHILDREN,$CHILD_ID"
              fi
              sleep 3
            done

            echo "Esperando a que Instagram procese las imágenes del carrusel..."
            sleep 15

            echo "Creando el contenedor del carrusel con hijos: $CHILDREN"
            RESPONSE=$(curl -s -X POST "$API/$IG_ACCOUNT_ID/media" \
              --data-urlencode "media_type=CAROUSEL" \
              --data-urlencode "children=$CHILDREN" \
              --data-urlencode "caption=$CAPTION" \
              --data-urlencode "access_token=$IG_ACCESS_TOKEN")
            echo "Respuesta de Meta: $RESPONSE"
            CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
            if [ -z "$CREATION_ID" ]; then
              echo "::error::No se pudo crear el contenedor del carrusel: $RESPONSE"
              exit 1
            fi
          fi

          echo "El contenedor se creó con id $CREATION_ID"
          echo "creation_id=$CREATION_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar a que Instagram procese el post
        if: ${{ github.event.inputs.instagram != 'no' }}
        run: sleep 20

      - name: Publicar el post en el feed
        if: ${{ github.event.inputs.instagram != 'no' }}
        env:
          CREATION_ID: ${{ steps.create.outputs.creation_id }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::Fallo al publicar en el feed: $RESPONSE"
            exit 1
          fi
          echo "✅ Publicado en el feed de @jeskocas"

      - name: Crear y publicar también en Historias de Instagram (si se pidió)
        if: ${{ github.event.inputs.story == 'si' || github.event.inputs.story == 'sí' }}
        env:
          IMAGE_URL: ${{ steps.image.outputs.first_url }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "Las Historias no admiten carrusel: se publica la primera imagen."
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "media_type=STORIES" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta (historia): $RESPONSE"
          CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          if [ -z "$CREATION_ID" ]; then
            echo "::error::No se pudo crear el contenedor de la historia: $RESPONSE"
            exit 1
          fi
          sleep 10
          RESPONSE2=$(curl -s -X POST "https://graph.facebook.com/v21.0/$IG_ACCOUNT_ID/media_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$IG_ACCESS_TOKEN")
          echo "Respuesta de Meta (publicar historia): $RESPONSE2"
          if echo "$RESPONSE2" | grep -q '"error"'; then
            echo "::error::Fallo al publicar la historia: $RESPONSE2"
            exit 1
          fi
          echo "✅ También publicado en Historias de Instagram"

      - name: Crear y publicar en Threads (si se pidió)
        if: ${{ github.event.inputs.threads == 'si' || github.event.inputs.threads == 'sí' }}
        env:
          URLS: ${{ steps.image.outputs.urls }}
          COUNT: ${{ steps.image.outputs.count }}
          CAPTION_RAW: ${{ github.event.inputs.caption }}
          CAPTION_THREADS_RAW: ${{ github.event.inputs.caption_threads }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CAPTION_THREADS_RAW" ]; then
            CAPTION_T=$(printf '%b' "$CAPTION_THREADS_RAW")
          else
            echo "Aviso: no se rellenó caption_threads, se usará el texto de Instagram tal cual."
            CAPTION_T=$(printf '%b' "$CAPTION_RAW")
          fi
          API="https://graph.threads.net/v1.0"

          if [ "$COUNT" = "1" ]; then
            RESPONSE=$(curl -s -X POST "$API/$THREADS_USER_ID/threads" \
              --data-urlencode "media_type=IMAGE" \
              --data-urlencode "image_url=$URLS" \
              --data-urlencode "text=$CAPTION_T" \
              --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
            echo "Respuesta de Threads (crear): $RESPONSE"
            CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          else
            echo "--- Carrusel de $COUNT imágenes en Threads ---"
            CHILDREN=""
            N=0
            for URL in $URLS; do
              N=$((N+1))
              echo "Creando hijo $N/$COUNT: $URL"
              RESPONSE=$(curl -s -X POST "$API/$THREADS_USER_ID/threads" \
                --data-urlencode "media_type=IMAGE" \
                --data-urlencode "image_url=$URL" \
                --data-urlencode "is_carousel_item=true" \
                --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
              echo "  Respuesta: $RESPONSE"
              CHILD_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
              if [ -z "$CHILD_ID" ]; then
                echo "::error::Fallo al crear la imagen $N del carrusel de Threads: $RESPONSE"
                exit 1
              fi
              if [ -z "$CHILDREN" ]; then
                CHILDREN="$CHILD_ID"
              else
                CHILDREN="$CHILDREN,$CHILD_ID"
              fi
              sleep 3
            done

            sleep 15

            RESPONSE=$(curl -s -X POST "$API/$THREADS_USER_ID/threads" \
              --data-urlencode "media_type=CAROUSEL" \
              --data-urlencode "children=$CHILDREN" \
              --data-urlencode "text=$CAPTION_T" \
              --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
            echo "Respuesta de Threads (carrusel): $RESPONSE"
            CREATION_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
          fi

          if [ -z "$CREATION_ID" ]; then
            echo "::error::No se pudo crear el contenedor de Threads."
            exit 1
          fi
          echo "El contenedor de Threads se creó con id $CREATION_ID"

          echo "Esperando a que Threads procese las imágenes..."
          sleep 20

          RESPONSE2=$(curl -s -X POST "$API/$THREADS_USER_ID/threads_publish" \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")
          echo "Respuesta de Threads (publicar): $RESPONSE2"
          if echo "$RESPONSE2" | grep -q '"error"'; then
            echo "::error::Fallo al publicar en Threads: $RESPONSE2"
            exit 1
          fi
          echo "✅ Publicado en Threads @jeskocas"

      - name: Publicar en la página de Facebook (si se pidió)
        if: ${{ github.event.inputs.facebook == 'si' || github.event.inputs.facebook == 'sí' }}
        env:
          URLS: ${{ steps.image.outputs.urls }}
          COUNT: ${{ steps.image.outputs.count }}
          CAPTION_RAW: ${{ github.event.inputs.caption }}
          CAPTION_FB_RAW: ${{ github.event.inputs.caption_facebook }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CAPTION_FB_RAW" ]; then
            CAPTION_F=$(printf '%b' "$CAPTION_FB_RAW")
          else
            echo "Aviso: no se rellenó caption_facebook, se usará el texto de Instagram tal cual."
            CAPTION_F=$(printf '%b' "$CAPTION_RAW")
          fi
          API="https://graph.facebook.com/v21.0"

          if [ "$COUNT" = "1" ]; then
            echo "--- Foto suelta en Facebook ---"
            RESPONSE=$(curl -s -X POST "$API/$FB_PAGE_ID/photos" \
              --data-urlencode "url=$URLS" \
              --data-urlencode "caption=$CAPTION_F" \
              --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN")
            echo "Respuesta de Facebook: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"error"'; then
              echo "::error::Fallo al publicar en Facebook: $RESPONSE"
              exit 1
            fi
          else
            echo "--- Álbum de $COUNT fotos en Facebook ---"
            # 1) Se sube cada foto SIN publicar, para quedarnos con su id
            ARGS=()
            N=0
            for URL in $URLS; do
              echo "Subiendo foto $((N+1))/$COUNT (sin publicar): $URL"
              RESPONSE=$(curl -s -X POST "$API/$FB_PAGE_ID/photos" \
                --data-urlencode "url=$URL" \
                --data-urlencode "published=false" \
                --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN")
              echo "  Respuesta: $RESPONSE"
              PHOTO_ID=$(echo "$RESPONSE" | grep -o '"id":"[0-9]*"' | head -1 | grep -o '[0-9]*')
              if [ -z "$PHOTO_ID" ]; then
                echo "::error::Fallo al subir la foto $((N+1)) a Facebook: $RESPONSE"
                exit 1
              fi
              ARGS+=(--data-urlencode "attached_media[$N]={\"media_fbid\":\"$PHOTO_ID\"}")
              N=$((N+1))
              sleep 2
            done

            # 2) Se crea la publicación con todas las fotos adjuntas
            echo "Creando la publicación con las $COUNT fotos..."
            RESPONSE=$(curl -s -X POST "$API/$FB_PAGE_ID/feed" \
              --data-urlencode "message=$CAPTION_F" \
              "${ARGS[@]}" \
              --data-urlencode "access_token=$FB_PAGE_ACCESS_TOKEN")
            echo "Respuesta de Facebook: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"error"'; then
              echo "::error::Fallo al publicar el álbum en Facebook: $RESPONSE"
              exit 1
            fi
          fi
          echo "✅ Publicado en la página de Facebook"
